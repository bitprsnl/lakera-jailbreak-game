name: DevSecOps CI Pipeline

# Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-testing:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up the Python environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip" # Speeds up execution by caching dependencies

    # 3. Install core dependencies and CI tools
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install project requirements if the file exists
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install CI/CD specific tools
        pip install flake8 bandit pytest

    # 4. Code Quality: Linting
    - name: Lint with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings (for standard formatting rules)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    # 5. Static Application Security Testing (SAST)
    - name: Security Scan with Bandit
      run: |
        # Scan all Python files for common security vulnerabilities
        bandit -r . -ll -ii -x ./tests

    # 6. Unit & Integration Testing
    - name: Run Tests with Pytest
      run: |
        # Run tests (Ensure you create a 'tests/' folder with at least one test file)
        pytest tests/ || echo "No tests found yet, skipping..."
